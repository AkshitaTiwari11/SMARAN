<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173C6E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Smaran — Cognitive Care Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF5FC;
    --surface:#FFFFFF;
    --ink:#152238;
    --ink-soft:#3E5372;
    --primary:#173C6E;
    --primary-light:#2E5F9E;
    --accent:#2E7FC1;
    --accent-soft:#DCEBFA;
    --sage:#8FB8DE;
    --sage-bg:#E7F1FB;
    --border:#D3E2F2;
    --gold:#C6A130;
    --gold-bg:#FBF1D8;
    --error:#B4483E;
    --error-bg:#FBEAE7;
    --radius:20px;
    --shadow: 0 6px 24px rgba(21,58,107,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;color-scheme:light;}
  body{
    background:
      radial-gradient(circle at 50% 0%, #F5FAFF 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'Atkinson Hyperlegible Next', sans-serif;
    font-size:21px;
    line-height:1.55;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  select, option, input{color-scheme:light; color:var(--ink);}
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:700;
    color:var(--primary);
    margin:0 0 8px 0;
    line-height:1.18;
  }
  h1{font-size:33px;}
  h2{font-size:26px;}
  h3{font-size:21px;}
  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  button, .chip, .radio-opt, .lang-opt, .opt-btn{ touch-action: manipulation; }
  button:focus-visible{ outline:3px solid var(--sage); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 22px 8px 22px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:44px;height:44px;border-radius:50% 50% 8px 8px;
    background:var(--primary);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Fraunces',serif;font-weight:700;font-size:22px;
    flex-shrink:0;
    border:2px solid var(--gold);
  }
  .motif-bar{
    height:5px;margin:0 22px;border-radius:3px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 8px, var(--accent-soft) 8px 16px);
    opacity:.6;
  }
  .brand-name{font-family:'Fraunces',serif;font-weight:700;font-size:23px;color:var(--primary);}
  .back-btn{
    background:none;border:none;color:var(--primary);font-size:20px;font-weight:700;
    cursor:pointer;padding:10px 6px;font-family:inherit;display:flex;align-items:center;gap:6px;
    min-height:48px;
  }
  .screen{
    flex:1;
    padding:14px 22px 32px 22px;
    display:flex;
    flex-direction:column;
    animation:fade .35s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:24px;
  }
  .btn{
    display:block;
    width:100%;
    border:none;
    border-radius:18px;
    padding:20px 22px;
    font-family:inherit;
    font-size:21px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
    min-height:68px;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:active{background:var(--primary-light);}
  .btn-primary:disabled{background:#B7C2D6;color:#EEF2F8;cursor:not-allowed;}
  .btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-ghost{background:none;color:var(--ink-soft);font-weight:700;text-decoration:underline;padding:16px;font-size:18px;}
  .btn-row{display:flex;gap:12px;margin-top:14px;}
  .btn-row .btn{flex:1;}
  .lang-grid{display:flex;flex-direction:column;gap:14px;margin-top:18px;}
  .lang-opt{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:2px solid var(--border);border-radius:18px;
    padding:20px 22px;cursor:pointer;font-size:22px;font-weight:700;min-height:68px;
  }
  .lang-opt .native{color:var(--ink-soft);font-weight:500;font-size:18px;}
  .lang-opt.selected{border-color:var(--primary);background:var(--sage-bg);}
  .tagline{color:var(--ink-soft);font-size:20px;margin:0 0 4px 0;}
  .hero-illustration{
    width:100%;height:150px;border-radius:100px 100px 18px 18px;margin:6px 0 18px 0;
    background:linear-gradient(180deg,var(--sage-bg),var(--accent-soft));
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:52px;
  }
  .progress-wrap{display:flex;align-items:center;gap:10px;margin:6px 0 14px 0;}
  .progress-track{flex:1;height:12px;background:var(--border);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s ease;}
  .progress-label{font-size:16px;color:var(--ink-soft);font-weight:700;white-space:nowrap;}
  .required-hint{font-size:17px;color:var(--primary);font-weight:700;margin:0 0 16px 0;}
  .q-block{margin-bottom:26px;}
  .q-label{font-size:22px;font-weight:700;margin-bottom:12px;display:block;color:var(--ink);}
  .q-hint{font-size:16px;color:var(--ink-soft);margin:8px 0 0 0;}
  input[type=text],input[type=tel],input[type=date],input[type=time],select,textarea{
    width:100%;font-family:inherit;font-size:21px;padding:16px 18px;
    border:2px solid var(--border);border-radius:14px;background:#fff;color:var(--ink);
    min-height:60px;
  }
  input:focus,select:focus,textarea:focus{outline:3px solid var(--sage);border-color:var(--primary);}
  .chip-group{display:flex;flex-wrap:wrap;gap:12px;}
  .chip{
    border:2px solid var(--border);background:#fff;border-radius:30px;padding:14px 20px;
    font-size:18px;font-weight:700;cursor:pointer;color:var(--ink);min-height:52px;display:flex;align-items:center;
  }
  .chip.selected{background:var(--primary);border-color:var(--primary);color:#fff;}
  .radio-group{display:flex;flex-direction:column;gap:12px;}
  .radio-opt{
    display:flex;align-items:center;gap:14px;border:2px solid var(--border);border-radius:16px;
    padding:16px 18px;cursor:pointer;font-size:20px;font-weight:600;min-height:60px;
  }
  .radio-opt.selected{border-color:var(--primary);background:var(--sage-bg);}
  .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-soft);flex-shrink:0;position:relative;}
  .radio-opt.selected .dot{border-color:var(--primary);}
  .radio-opt.selected .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary);}
  .family-card{
    display:flex;gap:14px;align-items:center;background:var(--surface);
    border:2px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;
  }
  .photo-circle{
    width:68px;height:68px;border-radius:50%;background:var(--sage-bg);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px;color:var(--primary);
    border:2px solid var(--border);
  }
  .photo-circle img{width:100%;height:100%;object-fit:cover;}
  .family-fields{flex:1;display:flex;flex-direction:column;gap:8px;}
  .family-fields input{padding:12px 14px;font-size:18px;min-height:48px;}
  .remove-btn{background:none;border:none;color:var(--accent);font-size:28px;cursor:pointer;padding:6px 10px;font-weight:700;}
  .upload-label{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:68px;height:68px;border-radius:50%;background:var(--sage-bg);border:2px dashed var(--primary-light);
    cursor:pointer;font-size:24px;color:var(--primary);flex-shrink:0;
  }
  .center-col{display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;flex:1;gap:18px;}
  .spinner{
    width:68px;height:68px;border-radius:50%;
    border:6px solid var(--sage-bg);border-top-color:var(--accent);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .stat-row{display:flex;gap:12px;margin:16px 0;}
  .stat-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;}
  .stat-num{font-family:'Fraunces',serif;font-size:32px;font-weight:700;color:var(--primary);}
  .stat-label{font-size:15px;color:var(--ink-soft);font-weight:600;}
  .game-card{
    background:var(--surface);border:2px solid var(--border);border-radius:18px;padding:22px;margin-bottom:14px;
  }
  .game-num{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:8px;}
  .game-q{font-size:22px;font-weight:700;margin-bottom:16px;}
  .opt-list{display:flex;flex-direction:column;gap:12px;}
  .opt-btn{
    text-align:left;border:2px solid var(--border);background:#fff;border-radius:14px;padding:16px 18px;
    font-size:19px;font-family:inherit;cursor:pointer;color:var(--ink);font-weight:600;
    display:flex;align-items:center;gap:12px;width:100%;min-height:60px;
  }
  .opt-num{
    width:32px;height:32px;border-radius:50%;background:var(--sage-bg);color:var(--primary);
    font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .opt-btn.correct{border-color:var(--primary);background:var(--sage-bg);color:var(--ink);}
  .opt-btn.wrong{border-color:var(--error);background:var(--error-bg);color:var(--ink);}
  .opt-btn:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);cursor:default;}
  .opt-btn:disabled .opt-num{opacity:1;}
  .badge{display:inline-block;background:var(--gold-bg);color:#8A6D1D;font-size:14px;font-weight:700;
    padding:5px 12px;border-radius:20px;margin-bottom:10px;}
  .speak-btn{
    width:54px;height:54px;border-radius:50%;border:2px solid var(--primary);background:#fff;
    color:var(--primary);font-size:24px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .speak-btn:active{background:var(--sage-bg);}
  .q-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:10px;}
  .q-header .game-q{margin-bottom:0;padding-top:8px;}
  .notif{
    background:var(--primary);color:#fff;border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;margin-top:16px;
  }
  .notif-icon{font-size:26px;}
  .notif-title{font-weight:700;font-size:17px;margin-bottom:4px;}
  .notif-body{font-size:15px;opacity:.9;}
  .skip-link{text-align:center;margin-top:10px;}
  .fixed-bottom{padding:14px 22px 22px 22px;}
  .nav-tabs{display:flex;border-top:1px solid var(--border);background:var(--surface);}
  .nav-tab{flex:1;padding:12px 4px 12px 4px;text-align:center;font-size:14px;font-weight:700;color:var(--ink-soft);cursor:pointer;border:none;background:none;font-family:inherit;min-height:64px;}
  .nav-tab.active{color:var(--primary);}
  .nav-tab .icon{font-size:26px;display:block;margin-bottom:3px;}
</style>
</head>

/* ---------------- Speech (Web Speech API) ---------------- */
const SPEECH_LANG_MAP = { en:'en-IN', hi:'hi-IN', as:'as-IN', brx:'hi-IN', kha:'en-IN', lus:'en-IN', mni:'en-IN' };
function speakText(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = SPEECH_LANG_MAP[state.lang] || 'en-IN';
    utter.rate = 0.85; utter.pitch = 1; utter.volume = 1;
    window.speechSynthesis.speak(utter);
  }catch(e){}
}
function makeSpeakBtn(text){
  const b = document.createElement('button');
  b.className='speak-btn'; b.type='button'; b.innerHTML='🔊'; b.title=L('listen');
  b.onclick=(e)=>{ e.stopPropagation(); speakText(text); };
  return b;
}
function speechForOptions(qText, opts){
  let s = qText + '. ';
  opts.forEach((o,i)=>{ s += `${L('optionWord')} ${i+1}: ${o.text||o}. `; });
  return s;
}

function qData(q){ return (QI18N[state.lang] && QI18N[state.lang][q.id]) || QI18N.en[q.id] || {}; }
function qLabel(q){ return qData(q).label || q.id; }
function qPlaceholder(q){ return qData(q).placeholder || ''; }
function qOptions(q){ return qData(q).options || []; }

/* 20 registration questions, grouped into 4 steps of 5 */
const QUESTIONS = [
  {id:'patientName', type:'text'},
  {id:'nickname', type:'text'},
  {id:'age', type:'text'},
  {id:'motherTongue', type:'text'},
  {id:'town', type:'text'},

  {id:'address', type:'text'},
  {id:'phone', type:'tel'},
  {id:'guardianName', type:'text'},
  {id:'guardianRelation', type:'select'},
  {id:'guardianPhone', type:'tel'},

  {id:'emergencyPhone', type:'tel'},
  {id:'occupation', type:'text'},
  {id:'favFood', type:'text'},
  {id:'favFestival', type:'text'},
  {id:'hobby', type:'text'},

  {id:'wakeTime', type:'text'},
  {id:'mealTime', type:'text'},
  {id:'forgetTasks', type:'multiselect'},
  {id:'supportLevel', type:'radio'},
  {id:'goal', type:'radio'},
];
const STEPS = [QUESTIONS.slice(0,5), QUESTIONS.slice(5,10), QUESTIONS.slice(10,15), QUESTIONS.slice(15,20)];

/* ---------------- Validation ---------------- */
function isAnswered(q){
  const v = state.answers[q.id];
  if(q.type==='text') return !!(v && String(v).trim().length>0);
  if(q.type==='tel') return !!(v && /^\d{10}$/.test(v));
  if(q.type==='select') return !!(v && String(v).length>0);
  if(q.type==='multiselect') return Array.isArray(v) && v.length>0;
  if(q.type==='radio') return !!(v && String(v).length>0);
  return true;
}
function isStepValid(stepIdx){ return STEPS[stepIdx].every(isAnswered); }
function updateNextButtonState(){
  const btn = document.getElementById('stepNextBtn');
  if(btn) btn.disabled = !isStepValid(state.stepIndex);
}

/* ---------------- Rendering ---------------- */
const root = document.getElementById('app');
function L(key){ return tt(state.lang, key); }

function render(){
  root.innerHTML = '';
  if(state.screen==='lang') return renderLang();
  if(state.screen==='welcome') return renderWelcome();
  if(state.screen==='survey') return renderSurvey();
  if(state.screen==='family') return renderFamily();
  if(state.screen==='reminder') return renderReminder();
  if(state.screen==='generating') return renderGenerating();
  if(state.screen==='dashboard') return renderDashboard();
}

function topbar(showBack, onBack, title){
  const bar = document.createElement('div');
  bar.className='topbar';
  const left = document.createElement('div');
  left.className='brand';
  if(showBack){
    const b = document.createElement('button');
    b.className='back-btn'; b.innerHTML='&larr; '+L('back');
    b.onclick=onBack;
    left.appendChild(b);
  } else {
    left.innerHTML = '<div class="brand-mark">स</div><div class="brand-name">Smaran</div>';
  }
  bar.appendChild(left);
  root.appendChild(bar);
  const motif = document.createElement('div'); motif.className='motif-bar';
  root.appendChild(motif);
}

function renderSurvey(){
  topbar(true, ()=>{
    if(state.stepIndex>0){ state.stepIndex--; render(); }
    else { state.screen='welcome'; render(); }
  });
  const s = document.createElement('div'); s.className='screen';
  const stepQs = STEPS[state.stepIndex];
  const pct = Math.round(((state.stepIndex)/STEPS.length)*100 + (100/STEPS.length));
  s.innerHTML = `
    <h2>${L('surveyTitle')}</h2>
    <p class="tagline" style="font-size:17px;">${L('surveyBody')}</p>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${L('step')} ${state.stepIndex+1} ${L('of')} ${STEPS.length}</div>
    </div>
    <p class="required-hint">${L('allRequired')}</p>
    <div id="qHolder"></div>
  `;
  root.appendChild(s);
  const holder = s.querySelector('#qHolder');
  stepQs.forEach(q=>holder.appendChild(renderQuestion(q)));

  const bottom = document.createElement('div'); bottom.className='fixed-bottom';
  const row = document.createElement('div'); row.className='btn-row';
  const nextBtn = document.createElement('button');
  nextBtn.id='stepNextBtn';
  nextBtn.className='btn btn-primary';
  nextBtn.textContent = L('next');
  nextBtn.disabled = !isStepValid(state.stepIndex);
  nextBtn.onclick=()=>{
    if(!isStepValid(state.stepIndex)) return;
    if(state.stepIndex<STEPS.length-1){ state.stepIndex++; render(); }
    else { state.screen='family'; render(); }
  };
  row.appendChild(nextBtn);
  bottom.appendChild(row);
  root.appendChild(bottom);
}

function renderQuestion(q){
  const block = document.createElement('div'); block.className='q-block';
  const label = document.createElement('label'); label.className='q-label';
  label.textContent = qLabel(q) + ' *';
  block.appendChild(label);

  if(q.type==='text'){
    const input = document.createElement('input');
    input.type='text'; input.placeholder=qPlaceholder(q);
    input.value = state.answers[q.id]||'';
    input.oninput=()=>{ state.answers[q.id]=input.value; updateNextButtonState(); };
    block.appendChild(input);
  } else if(q.type==='tel'){
    const input = document.createElement('input');
    input.type='tel'; input.placeholder=qPlaceholder(q);
    input.inputMode='numeric'; input.maxLength=10; input.pattern='[0-9]{10}';
    input.value = state.answers[q.id]||'';
    const hint = document.createElement('p'); hint.className='q-hint';
    hint.style.color='var(--error)'; hint.style.fontWeight='700';
    hint.textContent = L('phoneInvalid');
    hint.style.display = 'none';
    input.oninput=()=>{
      const digits = input.value.replace(/\D/g,'').slice(0,10);
      input.value = digits;
      state.answers[q.id]=digits;
      hint.style.display = (digits.length>0 && digits.length<10) ? 'block' : 'none';
      updateNextButtonState();
    };
    block.appendChild(input);
    block.appendChild(hint);
  } else if(q.type==='select'){
    const sel = document.createElement('select');
    const empty = document.createElement('option'); empty.textContent=L('chooseOne'); empty.value='';
    sel.appendChild(empty);
    qOptions(q).forEach(o=>{
      const op=document.createElement('option'); op.value=o; op.textContent=o;
      if(state.answers[q.id]===o) op.selected=true;
      sel.appendChild(op);
    });
    sel.onchange=()=>{ state.answers[q.id]=sel.value; updateNextButtonState(); };
    block.appendChild(sel);
  } else if(q.type==='multiselect'){
    const wrap = document.createElement('div'); wrap.className='chip-group';
    if(!state.answers[q.id]) state.answers[q.id]=[];
    qOptions(q).forEach(o=>{
      const chip = document.createElement('div');
      chip.className='chip'+(state.answers[q.id].includes(o)?' selected':'');
      chip.textContent=o;
      chip.onclick=()=>{
        const arr = state.answers[q.id];
        const idx = arr.indexOf(o);
        if(idx>-1) arr.splice(idx,1); else arr.push(o);
        render();
      };
      wrap.appendChild(chip);
    });
    block.appendChild(wrap);
  } else if(q.type==='radio'){
    const wrap = document.createElement('div'); wrap.className='radio-group';
    qOptions(q).forEach(o=>{
      const opt = document.createElement('div');
      opt.className='radio-opt'+(state.answers[q.id]===o?' selected':'');
      opt.innerHTML = `<div class="dot"></div><div>${o}</div>`;
      opt.onclick=()=>{ state.answers[q.id]=o; render(); };
      wrap.appendChild(opt);
    });
    block.appendChild(wrap);
  }
  return block;
}

  s.querySelector('#reminderInput').oninput = (e)=>{ state.reminderTime = e.target.value; };

  const bottom = document.createElement('div'); bottom.className='fixed-bottom';
  const btn = document.createElement('button'); btn.className='btn btn-primary'; btn.textContent=L('setReminder');
  btn.onclick=()=>{
    state.screen='generating'; render();
    setTimeout(()=>{ buildGameBank(); state.screen='dashboard'; state.tab='home'; render(); }, 2200);
  };
  bottom.appendChild(btn);
  root.appendChild(bottom);
}

}

function buildGenericGames(){
  const G = GENQ[state.lang] || GENQ.en;
  const now = new Date();
  const dayIdx = now.getDay();
  const correctDay = G.days[dayIdx];
  const otherDays = shuffleArr(G.days.filter((d,i)=>i!==dayIdx)).slice(0,2);
  const month = now.getMonth()+1;
  let seasonIdx = 4;
  if(month>=3&&month<=5) seasonIdx=0;
  else if(month>=6&&month<=9) seasonIdx=2;
  else if(month>=10&&month<=11) seasonIdx=3;
  const correctSeason = G.seasons[seasonIdx];
  const otherSeasons = shuffleArr(G.seasons.filter((s,i)=>i!==seasonIdx)).slice(0,2);

  const raw = [
    {q:G.qDay, c:correctDay, d:otherDays},
    {q:G.qSeason, c:correctSeason, d:otherSeasons},
  ].concat(G.items).concat([
    {q:G.qTueNext, c:G.days[3], d:[G.days[1], G.days[5]]},
  ]);
  return raw.map(r=>({ q:r.q, opts: shuffleArr([{text:r.c,correct:true}, ...r.d.map(x=>({text:x,correct:false}))]) }));
}

/* --------- Build a simulated AI-generated question bank from survey answers --------- */
function buildGameBank(){
  const a = state.answers;
  const fam = state.family.filter(m=>m.name);
  const bank = [];
  const GT = GENTXT[state.lang] || GENTXT.en;

  function push(q){ bank.push(q); }

  if(a.patientName) push({q:GT.fullName, opts:shuffleOpts(a.patientName, ['Radha Devi','Manoj Kumar','Anjali Basumatary'], GT)});
  if(a.nickname) push({q:GT.nickname, opts:shuffleOpts(a.nickname, ['Bubu','Deuta','Khuki'], GT)});
  if(a.town) push({q:GT.town, opts:shuffleOpts(a.town, ['Shillong','Kohima','Agartala'], GT)});
  if(a.phone) push({q:GT.phone, opts:shuffleOpts(a.phone, ['9954012233','8765043210','7002211456'], GT)});
  if(a.address) push({q:GT.address, opts:shuffleOpts(a.address, ['Near old market road','Ward no. 3, main road','Behind the temple lane'], GT)});
  if(a.guardianName) push({q:GT.guardianLookingAfter(a.guardianRelation || GT.defaultRelation), opts:shuffleOpts(a.guardianName, ['Rita Sharma','Bikash Rai','Momi Konwar'], GT)});
  if(a.guardianPhone) push({q:GT.guardianPhone(a.guardianName||GT.familyWord), opts:shuffleOpts(a.guardianPhone, ['9435098765','8256781234','7896541230'], GT)});
  if(a.favFood) push({q:GT.favFood, opts:shuffleOpts(a.favFood, ['Khar','Momo','Fish curry'], GT)});
  if(a.favFestival) push({q:GT.favFestival, opts:shuffleOpts(a.favFestival, ['Bihu','Hornbill Festival','Chapchar Kut'], GT)});
  if(a.occupation) push({q:GT.occupation, opts:shuffleOpts(a.occupation, [GT.farmer, GT.shopkeeper, GT.weaver], GT)});
  if(a.hobby) push({q:GT.hobby, opts:shuffleOpts(a.hobby, ['Painting','Fishing','Knitting'], GT)});
  if(a.wakeTime) push({q:GT.wakeTime, opts:shuffleOpts(a.wakeTime, ['5:00 AM','9:00 AM','11:00 AM'], GT)});
  if(a.mealTime) push({q:GT.mealTime, opts:shuffleOpts(a.mealTime, ['11:00 AM','3:00 PM','6:00 PM'], GT)});
  if(a.motherTongue) push({q:GT.motherTongue, opts:shuffleOpts(a.motherTongue, ['Hindi','Nepali','Bengali'], GT)});

  fam.forEach(m=>{
    push({q:GT.familyMemberName(m.relation||GT.defaultRelation), opts:shuffleOpts(m.name, fam.filter(x=>x!==m).map(x=>x.name).concat(['Ramesh','Sabita','Tenzin']).slice(0,3), GT)});
    push({q:GT.familyRelationship(m.name), opts:shuffleOpts(m.relation||GT.familyWord, [GT.neighbour, GT.doctor, GT.friend], GT)});
  });

  if(a.forgetTasks && a.forgetTasks.length){
    a.forgetTasks.forEach(t=>{
      push({q:GT.reminderTask(t), opts:[{text:GT.yesDone,correct:true},{text:GT.notYet,correct:false},{text:GT.willDoNow,correct:false}]});
    });
  }

  state.fullBankSize = 100;
  const genericPool = buildGenericGames();
  const personalCount = Math.min(4, bank.length);
  const dailyPersonal = shuffleArr(bank).slice(0, personalCount);
  const genericCount = 10 - dailyPersonal.length;
  let genericShuffled = shuffleArr(genericPool);
  while(genericShuffled.length < genericCount){ genericShuffled = genericShuffled.concat(shuffleArr(genericPool)); }
  const dailyGeneric = genericShuffled.slice(0, genericCount);
  state.gameSet = shuffleArr(dailyPersonal.concat(dailyGeneric));
}

function shuffleOpts(correct, distractors, GT){
  const filler = (GT && GT.notSure) || 'Not sure';
  const opts = [correct].concat(distractors.filter(d=>d && d!==correct).slice(0,2));
  while(opts.length<3) opts.push(filler);
  return shuffleArr(opts).map(o=>({text:o, correct:o===correct}));
}
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

            <div class="notif-icon">📩</div>
            <div><div class="notif-title">${L('reportSent')}</div><div class="notif-body">${L('reportBody')}</div></div>
          </div>
        </div>
      `;
      root.appendChild(s);
    } else {
      const g = state.gameSet[state.gameIndex];
      s.innerHTML = `
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${((state.gameIndex)/state.gameSet.length)*100}%"></div></div>
          <div class="progress-label">${state.gameIndex+1} / ${state.gameSet.length}</div>
        </div>
        <div class="game-card">
          <div class="game-num">${L('todayGames')}</div>
          <div class="q-header">
            <div id="gameSpeak"></div>
            <div class="game-q">${g.q}</div>
          </div>
          <div class="opt-list" id="optList"></div>
        </div>
        <button class="btn btn-primary" id="nextBtn" style="display:none;"></button>
      `;
      root.appendChild(s);
      s.querySelector('#gameSpeak').appendChild(makeSpeakBtn(speechForOptions(g.q, g.opts)));
      const optList = s.querySelector('#optList');
      const nextBtn = s.querySelector('#nextBtn');
      g.opts.forEach((o,optIdx)=>{
        const b = document.createElement('button'); b.className='opt-btn';
        b.innerHTML = `<span class="opt-num">${optIdx+1}</span><span>${o.text}</span>`;
        b.onclick=()=>{
          if(state.answeredCurrent) return;
          state.answeredCurrent=true;
          [...optList.children].forEach(c=>c.disabled=true);
          const chosenCorrect = o.correct;
          [...optList.children].forEach((c,i)=>{
            if(g.opts[i].correct) c.classList.add('correct');
            else if(c===b && !chosenCorrect) c.classList.add('wrong');
          });
          if(chosenCorrect) state.correctCount++;
          nextBtn.style.display='block';
          nextBtn.textContent = (state.gameIndex===state.gameSet.length-1) ? L('finishSet') : L('nextQ');
        };
        optList.appendChild(b);
      });
      nextBtn.onclick=()=>{ state.gameIndex++; state.answeredCurrent=false; render(); };

  else if(state.tab==='family'){

function renderTabs(){

    {id:'home', icon:'🏠', label:L('tabHome')},

    {id:'family', icon:'👪', label:L('tabFamily')},

  ];

    const btn = document.createElement('button'); btn.className='nav-tab'+(state.tab===it.id?' active':'');
    btn.innerHTML = `<span class="icon">${it.icon}</span>${it.label}`;
    btn.onclick=()=>{ state.tab=it.id; if(it.id==='games'){ state.gameIndex=0; state.correctCount=0; state.answeredCurrent=false; } render(); };
    tabs.appendChild(btn);
  });
  root.appendChild(tabs);
}
